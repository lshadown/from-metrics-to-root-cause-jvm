services:
    # =========================
    # Reverse proxy: Caddy (TLS)
    # =========================
    caddy:
      image: caddy:2
      container_name: caddy
      restart: unless-stopped
      ports:
        - "80:80"
        - "443:443"
      environment:
        - DEMO_AUTH_HASH=${DEMO_AUTH_HASH}
      volumes:
        - ./observability/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
        - caddy_data:/data
        - caddy_config:/config
      depends_on:
        - api-service
        - external-service

    # =========================
    # Metrics: Prometheus
    # =========================
    prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      restart: unless-stopped
      ports:
        - "9090:9090"
      volumes:
        - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      command:
        - --config.file=/etc/prometheus/prometheus.yml
      depends_on:
        - api-service
        - external-service

    # =========================
    # Dashboards: Grafana
    # =========================
    grafana:
      image: grafana/grafana:latest
      container_name: grafana
      restart: unless-stopped
      ports:
        - "3000:3000"
      environment:
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
        - GF_SERVER_ROOT_URL=https://grafana.gruzewski.dev
        - GF_AUTH_ANONYMOUS_ENABLED=true
        - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      volumes:
        - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
        - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      depends_on:
        - prometheus
        - loki

    # =========================
    # Logs: Loki
    # =========================
    loki:
      image: grafana/loki:3.4.1
      container_name: loki
      restart: unless-stopped
      command:
        - -config.file=/etc/loki/local-config.yaml
      ports:
        - "3100:3100"
      volumes:
        - lokidata:/loki

    # =========================
    # Logs: Promtail (ships docker logs -> Loki)
    # =========================
    promtail:
      image: grafana/promtail:3.4.1
      container_name: promtail
      restart: unless-stopped
      command:
        - -config.file=/etc/promtail/promtail.yml
      volumes:
        - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
        - /var/run/docker.sock:/var/run/docker.sock:ro
      depends_on:
        - loki

    # =========================
    # Tracing: Zipkin
    # =========================
    zipkin:
      image: openzipkin/zipkin:latest
      container_name: zipkin
      restart: unless-stopped
      ports:
        - "9411:9411"
    external-service:
      build: ./external-service
      restart: unless-stopped
      ports:
        - "8081:8081"
      environment:
        - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://zipkin:9411/v1/traces
        - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8081/enrichment?userId=1"]
        interval: 5s
        timeout: 3s
        retries: 5
        start_period: 15s

    api-service:
      build: ./api-service
      restart: unless-stopped
      ports:
        - "8080:8080"
      environment:
        - EXTERNAL_BASE_URL=http://external-service:8081
        - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://zipkin:9411/v1/traces
        - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      depends_on:
        external-service:
          condition: service_healthy
volumes:
  lokidata:
  caddy_data:
  caddy_config:
